[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rogueprompt"
version = "0.1.0"
description = "RoguePrompt transformations, ablation prompt sets, baselines, and evaluation utilities."
requires-python = ">=3.10"
dependencies = []

[project.scripts]
rogueprompt-evaluate = "rogueprompt.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["rogueprompt*"]
