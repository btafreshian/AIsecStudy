[build-system]
# 77 is the floor for the PEP 639 license fields below; older setuptools
# rejects a bare SPDX string for project.license.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rogueprompt"
version = "0.1.0"
description = "RoguePrompt transformations, ablation prompt sets, baselines, and evaluation utilities."
requires-python = ">=3.10"
dependencies = []
license = "MIT"
license-files = [
    "LICENSE",
    # Attribution for the StrongREJECT data in data/.
    "NOTICE",
]

[project.optional-dependencies]
# Embedding-similarity backend (jina-embeddings-v3 via sentence-transformers).
embeddings = ["sentence-transformers>=3.0.0", "einops>=0.7.0"]
# HTTP client for the integrated OpenAI-compatible LLM judge.
judge = ["httpx>=0.27.0"]
all = ["rogueprompt[embeddings,judge]"]

[project.scripts]
rogueprompt-evaluate = "rogueprompt.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["rogueprompt*"]
